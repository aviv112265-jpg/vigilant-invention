; MISHPACHA - editor defaults.
; Engine Scalability for the editor viewport and Play-In-Editor: Medium (0 Low, 1 Medium, 2 High, 3 Epic, 4 Cinematic).
; Medium keeps a GTX 1650 laptop playable; change it from the viewport: Settings -> Engine Scalability Settings.
