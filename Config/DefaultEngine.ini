; MISHPACHA - engine configuration.
; NOTE: Unreal ini files do not support inline comments; keep comments on their own lines.

[/Script/EngineSettings.GameMapsSettings]
; Create your first level (for example /Game/Maps/TelAvir_Greybox) and then uncomment these:
;GameDefaultMap=/Game/Maps/TelAvir_Greybox.TelAvir_Greybox
;EditorStartupMap=/Game/Maps/TelAvir_Greybox.TelAvir_Greybox
GlobalDefaultGameMode=/Script/Mishpacha.StoryGameMode
GameInstanceClass=/Script/Mishpacha.MishpachaGameInstance

[/Script/HardwareTargeting.HardwareTargetingSettings]
TargetedHardwareClass=Desktop
AppliedTargetedHardwareClass=Desktop
DefaultGraphicsPerformance=Maximum
AppliedDefaultGraphicsPerformance=Maximum

[/Script/Engine.RendererSettings]
; Lumen global illumination + reflections, Virtual Shadow Maps, Nanite-friendly defaults.
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.GenerateMeshDistanceFields=True
r.Shadow.Virtual.Enable=1
r.AllowStaticLighting=False
r.SkinCache.CompileShaders=True
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=True
; Custom depth WITH stencil - needed for Omer's drone enemy-marking outline.
r.CustomDepth=3

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12
; Shader Model 6: required by Nanite and Virtual Shadow Maps (GTX 1650 and newer support it).
-D3D12TargetedShaderFormats=PCD3D_SM5
+D3D12TargetedShaderFormats=PCD3D_SM6

[OnlineSubsystem]
; Null = LAN / direct IP. Works out of the box for testing with friends on the same network.
DefaultPlatformService=Null

[OnlineSubsystemNull]
bEnabled=true

